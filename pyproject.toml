[project]
name = "ragaiml-mh2"
version = "0.1.0"
description = "Multi-agent RAG API with FastAPI, Ollama and persistent Chroma storage"
readme = "README.md"
authors = [
    { name = "mirudevext", email = "mirudevgit@booklocal.co.in" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.18,<1",
    "pydantic-settings>=2.6,<3",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-chroma>=1,<2",
    "langchain-huggingface>=1,<2",
    "langchain-text-splitters>=1,<2",
    "chromadb>=1,<2",
    "sentence-transformers>=5,<6",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[project.scripts]
ragaiml-mh2 = "ragaiml_mh2:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
